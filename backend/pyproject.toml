[project]
name = "binance-fast-trade"
version = "0.1.0"
description = "单人自用的币安合约快速交易系统（浮动挂单 + 策略 + AI 助手）"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    # Web
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "itsdangerous>=2.2",            # SessionMiddleware 需要

    # 配置
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",

    # 数据库
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",

    # 安全
    "argon2-cffi>=23.1",            # PIN hash
    "cryptography>=42.0",           # Fernet

    # 币安
    "httpx>=0.27",                  # 自己用 httpx 封装 REST，签名简单灵活
    "websockets>=12.0",             # WS 客户端

    # 工具
    "orjson>=3.10",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "httpx>=0.27",                  # TestClient 也需要
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
python_files = "test_*.py"
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]
ignore = ["E501"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
